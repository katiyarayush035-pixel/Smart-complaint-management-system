<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Smart Complaint Management</title>

    <script>
        try {
            var t = localStorage.getItem("theme");
            if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) { }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-bar">

        <div class="left">
            <a href="index.html" class="logo" aria-label="Back to the complaint site">
                <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <rect x="2" y="4" width="28" height="20" rx="6" fill="var(--brand)"></rect>
                    <path d="M9 24v5l6-5z" fill="var(--brand)"></path>
                    <path d="M10 14l4 4 8-8" fill="none" stroke="var(--brand-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <div>Smart<span>Complaint</span></div>
            </a>
            <span class="role-badge">Admin</span>
        </div>

        <div class="right">
            <div class="sync on" id="sync" role="status">
                <i class="sync-dot"></i>
                <span class="sync-text" id="syncText">Loading…</span>
            </div>
            <button class="icon-btn theme-toggle" data-theme-toggle type="button" aria-label="Switch to light theme" aria-pressed="false">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            </button>
            <button type="button" class="btn btn-ghost" id="logoutBtn" style="padding:10px 16px">Log out</button>
        </div>

    </header>


    <main class="container">

        <div class="page-title">
            <div>
                <h1>Complaints</h1>
                <p id="subtitle">Review, filter and update every complaint.</p>
            </div>
        </div>

        <!-- Statistics (click one to filter the table) -->

        <section class="stats" aria-label="Complaint totals">

            <button type="button" class="stat-card" data-filter="all">
                <h3>Total complaints</h3>
                <p id="totalComplaints">0</p>
                <small id="totalHint">All time</small>
            </button>

            <button type="button" class="stat-card" data-filter="Pending">
                <h3>Pending</h3>
                <p id="pendingComplaints">0</p>
                <small>Need a first review</small>
            </button>

            <button type="button" class="stat-card" data-filter="In Progress">
                <h3>In progress</h3>
                <p id="progressComplaints">0</p>
                <small>Being worked on</small>
            </button>

            <button type="button" class="stat-card" data-filter="Resolved">
                <h3>Resolved</h3>
                <p id="resolvedComplaints">0</p>
                <small id="resolvedHint">Closed</small>
            </button>

        </section>


        <!-- Charts -->

        <section class="charts" aria-label="Charts">

            <div class="panel">
                <h2>Last 14 days</h2>
                <p class="panel-sub">New complaints per day</p>
                <div id="trendChart"></div>
            </div>

            <div class="panel">
                <h2>By status</h2>
                <p class="panel-sub">Click a slice to filter</p>
                <div id="statusChart"></div>
            </div>

            <div class="panel">
                <h2>By category</h2>
                <p class="panel-sub">Where problems come from</p>
                <div id="categoryChart"></div>
            </div>

        </section>


        <!-- Complaint Table -->

        <section class="panel" aria-label="All complaints">

            <div class="toolbar">

                <h2>All complaints</h2>

                <div class="search-wrap">
                    <input type="text" id="searchInput" placeholder="Search by ID, name, email or text" aria-label="Search complaints" autocomplete="off">
                    <kbd>/</kbd>
                </div>

                <select id="categoryFilter" class="admin-select" aria-label="Filter by category">
                    <option value="all">All categories</option>
                    <option value="Technical">Technical</option>
                    <option value="Academic">Academic</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Hostel">Hostel</option>
                    <option value="Other">Other</option>
                </select>

                <button type="button" class="small-btn" id="autoBtn" aria-pressed="true">Auto-refresh: on</button>
                <button type="button" class="small-btn" id="refreshBtn">Refresh</button>
                <button type="button" class="small-btn" id="csvBtn">Export CSV</button>

            </div>

            <div class="tabs" id="tabs" role="tablist" aria-label="Filter by status"></div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th scope="col" data-sort="id" aria-sort="none"><button type="button">Complaint ID <i class="arrow">▲▼</i></button></th>
                            <th scope="col" data-sort="name" aria-sort="none"><button type="button">Complainant <i class="arrow">▲▼</i></button></th>
                            <th scope="col" data-sort="category" aria-sort="none"><button type="button">Category <i class="arrow">▲▼</i></button></th>
                            <th scope="col">Description</th>
                            <th scope="col" data-sort="created" aria-sort="descending"><button type="button">Submitted <i class="arrow">▼</i></button></th>
                            <th scope="col" data-sort="status" aria-sort="none"><button type="button">Status <i class="arrow">▲▼</i></button></th>
                            <th scope="col">Update</th>
                        </tr>
                    </thead>

                    <tbody id="complaintsTable">
                        <tr><td colspan="7" class="table-message">Loading complaints…</td></tr>
                    </tbody>

                </table>

            </div>

            <div class="pager" id="pager">
                <span id="pagerInfo"></span>
                <div class="pager-btns">
                    <button type="button" class="small-btn" id="prevBtn">Previous</button>
                    <button type="button" class="small-btn" id="nextBtn">Next</button>
                </div>
            </div>

        </section>

    </main>


    <!-- Detail drawer -->

    <div class="scrim" id="scrim"></div>

    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">

        <div class="drawer-head">
            <h2 id="drawerTitle">Complaint</h2>
            <button type="button" class="icon-btn" id="drawerClose" aria-label="Close details">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
        </div>

        <div class="drawer-body" id="drawerBody"></div>

    </aside>

    <div class="tip" id="tip" role="tooltip"></div>


    <script src="fx.js"></script>
    <script src="admin.js"></script>

</body>

</html>
